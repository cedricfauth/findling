[project]
name = "findling"
version = "0.4.0"
description = "Private local search over your folders, by meaning and by exact words."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "cocoindex>=1.1.0",
    "docling>=2.73.1",
    # Intel Mac pins, here (not in [tool.uv]) so `uv tool install` applies them too:
    "docling-parse<5",   # 4.7.2 is the last release with Intel Mac wheels
    "fastapi>=0.162.0",
    "lxml>=6.1.3",
    "mcp>=2.3.0",
    "numpy<2",           # torch 2.2.2 (the last for Intel Macs) was built against numpy 1.x
    "sentence-transformers>=5.7.0",
    "sqlite-vec>=0.1.9",
    "tomlkit>=0.15.2",
    "torch>=2.2.2",
    "torchvision>=0.17.2",
    "uvicorn>=0.54.0",
]

[project.scripts]
findling = "findling.server:main"            # web app + live indexing
findling-search = "findling.search:main"     # command-line search
findling-mcp = "findling.mcp_stdio:main"     # stdio MCP bridge for Claude Desktop

[build-system]
requires = ["uv_build>=0.9.7,<0.10.0"]
build-backend = "uv_build"

[tool.uv]
# Intel Mac: torch tops out at 2.2.2 and needs Python <= 3.12.
required-environments = ["sys_platform == 'darwin' and platform_machine == 'x86_64'"]

# CPU-only torch (Mac builds are CPU/MPS anyway; this keeps Linux free of CUDA)
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

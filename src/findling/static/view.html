<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Findling</title>
<style>
  :root {
    --bg: #f7f7f5;
    --surface: #ffffff;
    --surface-2: #f0f0ed;
    --text: #1d1d1b;
    --muted: #6b6b66;
    --border: #e2e2dd;
    --accent: #2f5bd3;
    --chunk: #fff6c7;
    --chunk-edge: #f0c419;
    --word: #ffd35c;
    --bad: #c53030;
    --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161615;
      --surface: #1f1f1d;
      --surface-2: #2a2a27;
      --text: #ececea;
      --muted: #9a9a94;
      --border: #33332f;
      --accent: #7c9cf5;
      --chunk: #3a3315;
      --chunk-edge: #b8941c;
      --word: #7a6216;
      --bad: #f07272;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  }
  button { font: inherit; color: inherit; cursor: pointer; border: 1px solid var(--border);
    background: var(--surface); border-radius: 8px; padding: 3px 10px; font-size: 13px; }
  button:hover { background: var(--surface-2); }
  header {
    position: sticky; top: 0; z-index: 1; background: var(--surface);
    border-bottom: 1px solid var(--border); padding: 10px 16px;
    display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px;
  }
  .title { min-width: 0; flex: 1 1 280px; }
  .name { font-weight: 600; }
  .path { font-size: 12px; color: var(--muted); word-break: break-all; }
  .actions { display: flex; flex-wrap: wrap; gap: 6px; }
  .note { width: 100%; font-size: 13px; color: var(--muted); }
  .note.bad { color: var(--bad); }
  main { padding: 12px 0 40vh; }
  .code { font: 13px/1.55 var(--mono); tab-size: 4; overflow-x: auto; }
  .ln { position: relative; padding: 0 16px 0 calc(var(--gutter, 4ch) + 28px);
    white-space: pre; min-height: 1.55em; width: max-content; min-width: 100%; }
  .wrap .ln { white-space: pre-wrap; overflow-wrap: anywhere; width: auto; }
  .ln::before {
    content: attr(data-n); position: absolute; left: 0; width: calc(var(--gutter, 4ch) + 12px);
    text-align: right; color: var(--muted); opacity: .7; user-select: none;
  }
  .ln.in-chunk { background: var(--chunk); box-shadow: inset 3px 0 var(--chunk-edge); }
  mark { color: inherit; border-radius: 2px; }
  mark.findling-chunk { background: none; }
  mark.findling-word { background: var(--word); }
</style>
</head>
<body>
<header>
  <div class="title">
    <div class="name" id="name">Loading…</div>
    <div class="path" id="path"></div>
  </div>
  <div class="actions">
    <button type="button" id="jump" hidden>Jump to match</button>
    <button type="button" id="wrap">Wrap lines</button>
    <button type="button" id="open">Open</button>
    <button type="button" id="reveal">Show in Finder</button>
  </div>
  <div class="note" id="note" hidden></div>
</header>
<main><div class="code" id="code"></div></main>
<script src="/static/highlight.js"></script>
<script>
"use strict";
const H = window.FindlingHighlight;
const params = new URLSearchParams(location.search);
const folder = params.get("folder") || "", path = params.get("path") || "";
const $ = (id) => document.getElementById(id);

function note(text, bad = false) {
  $("note").textContent = text;
  $("note").className = "note" + (bad ? " bad" : "");
  $("note").hidden = !text;
}

async function getJSON(url) {
  const r = await fetch(url);
  const body = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(body.detail || `Request failed (${r.status})`);
  return body;
}

async function openFile(reveal) {
  try {
    const r = await fetch("/api/open", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ folder, path, reveal }) });
    if (!r.ok) throw new Error((await r.json().catch(() => ({}))).detail || "Could not open the file.");
  } catch (e) { note(e.message, true); }
}

// One <div class="ln"> per line; marked parts of a line become <mark>s.
function render(text, marks) {
  const code = $("code");
  const frag = document.createDocumentFragment();
  const words = marks.words;
  let w = 0, first = null, n = 0;
  const breaks = /\r\n|\r|\n/g;
  for (let start = 0; start <= text.length; ) {
    const m = breaks.exec(text);
    const end = m ? m.index : text.length;
    const line = document.createElement("div");
    line.className = "ln";
    line.dataset.n = ++n;
    while (w < words.length && words[w][1] <= start) w++;
    const inChunk = marks.chunk && marks.chunk[0] < Math.max(end, start + 1) && marks.chunk[1] > start;
    const hasWord = w < words.length && words[w][0] < end;
    if (inChunk || hasWord) {
      if (inChunk) line.classList.add("in-chunk");
      for (const p of H.pieces(start, end, marks)) {
        const t = text.slice(p.start, p.end);
        if (!p.cls) { line.append(t); continue; }
        const mk = document.createElement("mark");
        mk.className = p.cls;
        mk.textContent = t;
        line.append(mk);
      }
      first = first || line;
    } else {
      line.textContent = text.slice(start, end);
    }
    frag.append(line);
    if (!m) break;
    start = m.index + m[0].length;
  }
  code.style.setProperty("--gutter", String(n).length + "ch");
  code.replaceChildren(frag);
  return first;
}

async function main() {
  if (!folder || !path) { $("name").textContent = "No file given"; return; }
  $("path").textContent = path;
  $("open").onclick = () => openFile(false);
  $("reveal").onclick = () => openFile(true);
  if (!/Mac/.test(navigator.platform)) $("reveal").textContent = "Show in folder";
  try { if (localStorage.getItem("findling.wrap") === "1") $("code").classList.add("wrap"); } catch {}
  $("wrap").onclick = () => {
    const on = $("code").classList.toggle("wrap");
    try { localStorage.setItem("findling.wrap", on ? "1" : "0"); } catch {}
  };
  const query = new URLSearchParams({ folder, path, chunk: params.get("chunk") ?? "", q: params.get("q") ?? "" });
  let file, info;
  try {
    [file, info] = await Promise.all([
      getJSON("/api/text?" + new URLSearchParams({ folder, path })),
      getJSON("/api/chunk?" + query),
    ]);
  } catch (e) {
    $("name").textContent = path.split("/").pop();
    note(e.message, true);
    return;
  }
  document.title = file.name + " – Findling";
  $("name").textContent = file.name;
  $("path").textContent = file.full_path;
  const marks = H.ranges(file.text, info.text, info.needles);
  if (info.text && !marks.chunk)
    note(marks.words.length
      ? "The passage wasn't found in the file (it may have changed since indexing). Showing the search words."
      : "The passage wasn't found in the file (it may have changed since indexing).");
  const first = render(file.text, marks);
  if (first) {
    $("jump").hidden = false;
    $("jump").onclick = () => H.scrollTo(first);
    H.scrollTo(first);
  }
}
main();
</script>
</body>
</html>

<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0}
body{width:1280px;height:640px;background:#f7f7f5;font-family:-apple-system,"SF Pro Display","Helvetica Neue",sans-serif;color:#1d1d1b;overflow:hidden;position:relative}
.left{position:absolute;left:72px;top:0;bottom:0;width:470px;display:flex;flex-direction:column;justify-content:center}

<div class="left">
  <img class="logo" src="../../../mcpb/icon.png">
